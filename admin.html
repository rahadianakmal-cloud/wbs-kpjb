<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — WBS KPJB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#B4842A;
    --sky:#52BAEC;
    --royal:#0A44A0;
    --ruby:#E3112B;
    --glass-text:#EAF1FB;
    --glass-muted:#BFD0EA;
    --serif:'Source Serif 4',Georgia,serif;
    --sans:'IBM Plex Sans',Arial,sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;background:#0A1633;}
  body{
    margin:0;min-height:100vh;color:var(--glass-text);font-family:var(--sans);line-height:1.5;
    background:linear-gradient(180deg,#0A1633 0%,#0C2459 55%,#0A3A8C 100%) fixed;
    position:relative;overflow-x:hidden;isolation:isolate;
  }
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;}
  body::before{
    width:600px;height:600px;right:-200px;top:-160px;
    background:radial-gradient(circle at 40% 40%,rgba(82,186,236,.6),rgba(82,186,236,0) 68%);
  }
  body::after{
    width:480px;height:480px;left:-200px;bottom:-120px;
    background:radial-gradient(circle,rgba(227,17,43,.28),rgba(227,17,43,0) 70%);
  }

  .glass-card{
    background:rgba(20,40,90,.82);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    box-shadow:0 10px 36px rgba(2,8,30,.35), inset 0 1px 0 rgba(255,255,255,.16);
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass-card{
      background:rgba(255,255,255,.08);
      -webkit-backdrop-filter:blur(20px) saturate(150%);
      backdrop-filter:blur(20px) saturate(150%);
    }
  }

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,22,52,.94);
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);}
  }
  .header-inner{
    max-width:1080px;margin:0 auto;padding:12px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{height:42px;width:auto;flex-shrink:0;}
  .brand-name{font-size:13.5px;letter-spacing:.02em;color:var(--glass-muted);}
  .brand-name strong{display:block;font-family:var(--serif);font-size:16px;color:#fff;font-weight:600;}
  #logoutBtn{
    display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);
    color:#fff;padding:8px 18px;border-radius:999px;font-size:13.5px;cursor:pointer;font-family:var(--sans);
    transition:background .2s;
  }
  #logoutBtn:hover{background:rgba(255,255,255,.16);}

  .wrap{max-width:1080px;margin:0 auto;padding:36px 28px 64px;}

  /* ---------- Login ---------- */
  #loginBox{max-width:400px;margin:56px auto 0;padding:34px;}
  #loginBox h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 6px;color:#fff;}
  #loginBox p{font-size:13.5px;color:var(--glass-muted);margin:0 0 24px;}
  #loginBox label{font-size:13px;font-weight:500;display:block;margin-bottom:6px;color:var(--glass-text);}
  #loginBox input{
    width:100%;padding:12px 14px;border:1px solid #34508A;border-radius:10px;margin-bottom:16px;
    font-size:14.5px;background:#0A1A40;color:#fff;outline:none;font-family:var(--sans);
  }
  #loginBox input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(82,186,236,.25);}
  #loginBox button{
    width:100%;background:var(--gold);border:none;color:#fff;padding:13px;border-radius:12px;
    font-weight:500;font-size:15px;cursor:pointer;font-family:var(--sans);
    box-shadow:0 6px 18px rgba(180,132,42,.35);
  }
  #loginBox button:hover{background:#C4954A;}
  #loginBox button:disabled{opacity:.6;cursor:not-allowed;}
  #loginErr{color:#FF8A98;font-size:13px;margin-top:12px;min-height:1em;}

  /* ---------- Dashboard ---------- */
  #dash{display:none;}
  .page-title{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;color:#fff;}
  .page-sub{margin:0 0 26px;color:var(--glass-muted);font-size:14px;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  .stat{padding:18px 22px;}
  .stat .n{font-family:var(--serif);font-size:32px;font-weight:600;color:#fff;line-height:1.1;}
  .stat .l{font-family:var(--mono);font-size:11.5px;color:var(--sky);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

  .table-wrap{
    overflow-x:auto;background:#0F2252;border:1px solid rgba(255,255,255,.14);
    border-radius:18px;box-shadow:0 14px 40px rgba(2,8,30,.4);
  }
  table{width:100%;border-collapse:collapse;min-width:780px;}
  th,td{text-align:left;padding:14px 16px;font-size:13.5px;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.08);}
  th{
    background:rgba(10,68,160,.45);color:var(--glass-text);font-weight:500;
    font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  }
  tbody tr.main:hover td{background:rgba(255,255,255,.04);}
  .case-no{font-family:var(--mono);font-size:12px;color:var(--sky);white-space:nowrap;}
  td.muted{color:var(--glass-muted);}

  select.statusSel{
    font-family:var(--sans);font-size:12.5px;padding:6px 10px;border-radius:999px;
    background:#0A1A40;color:#fff;border:1px solid #34508A;outline:none;color-scheme:dark;cursor:pointer;
  }
  select.statusSel.st-baru{border-color:var(--sky);color:var(--sky);}
  select.statusSel.st-diproses{border-color:#E0B24D;color:#E0B24D;}
  select.statusSel.st-selesai{border-color:#7DE0A0;color:#7DE0A0;}
  select.statusSel.st-ditolak{border-color:#FF8A98;color:#FF8A98;}

  .expand{
    cursor:pointer;color:#fff;font-size:12.5px;font-family:var(--sans);
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
    padding:6px 14px;border-radius:999px;transition:background .2s;
  }
  .expand:hover{background:rgba(255,255,255,.16);}

  tr.detail-row{display:none;}
  tr.detail-row.show{display:table-row;}
  tr.detail-row td{background:rgba(5,14,40,.55);padding:22px 24px;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 28px;}
  .kv .k{font-family:var(--mono);font-size:11px;color:var(--sky);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
  .kv .v{font-size:14px;color:var(--glass-text);word-break:break-word;}
  .kv.full{grid-column:1 / -1;}
  .file-link{
    display:inline-block;margin:0 10px 6px 0;padding:5px 12px;border-radius:999px;
    background:rgba(82,186,236,.15);border:1px solid rgba(82,186,236,.4);
    color:var(--sky);text-decoration:none;font-size:13px;
  }
  .file-link:hover{background:rgba(82,186,236,.28);}

  .empty{padding:48px;text-align:center;color:var(--glass-muted);}
  #loadMsg{color:var(--glass-muted);padding:20px 0;}

  .tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .tab{
    cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--glass-text);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:10px 18px;transition:background .2s,border-color .2s;
    display:inline-flex;align-items:center;gap:10px;
  }
  .tab:hover{background:rgba(255,255,255,.12);}
  .tab[aria-selected="true"]{background:rgba(82,186,236,.16);border-color:var(--sky);color:#fff;box-shadow:0 0 0 3px rgba(82,186,236,.18);}
  .badge{
    display:none;min-width:22px;padding:1px 7px;border-radius:999px;text-align:center;
    background:var(--sky);color:#06142E;font-size:12px;font-weight:600;
  }
  .badge.on{display:inline-block;}
  td .sub{font-size:12px;color:var(--glass-muted);margin-top:2px;}

  /* Panel penyerahan (diisi admin) */
  .pen{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;border:1px solid;margin-top:4px;}
  .pen-wait{color:#E0B24D;border-color:#E0B24D;}
  .pen-ok{color:#7DE0A0;border-color:#7DE0A0;}
  .pen-no{color:#FF8A98;border-color:#FF8A98;}
  .handling{
    grid-column:1 / -1;margin-top:6px;padding:20px;border-radius:14px;
    border:1px solid rgba(82,186,236,.4);background:rgba(82,186,236,.08);
  }
  .h-title{font-family:var(--serif);font-size:17px;font-weight:600;color:#fff;margin-bottom:14px;}
  .h-title span{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--glass-muted);}
  .h-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
  .hf.full{grid-column:1 / -1;}
  .hf label{display:block;font-family:var(--mono);font-size:11px;color:var(--sky);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .hf select,.hf input[type=date],.hf textarea,.hf input[type=file]{
    width:100%;font-family:var(--sans);font-size:14px;color:#fff;background:#0A1A40;
    border:1px solid #34508A;border-radius:10px;padding:10px 12px;outline:none;color-scheme:dark;
  }
  .hf select:focus,.hf input:focus,.hf textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(82,186,236,.25);}
  .hf textarea{resize:vertical;min-height:60px;}
  .h-hint{font-size:12px;color:var(--glass-muted);margin-top:5px;}
  .h-files{margin-bottom:8px;}
  .h-newlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .h-newlist div{
    display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--glass-muted);
    background:#0A1A40;border:1px solid #34508A;border-radius:10px;padding:7px 12px;
  }
  .h-newlist button{border:none;background:none;color:#FF8A98;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0;}
  .h-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;}
  .btn-save{
    background:var(--gold);color:#fff;border:none;border-radius:12px;padding:11px 24px;font-size:14.5px;
    font-weight:500;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 18px rgba(180,132,42,.35);
  }
  .btn-save:hover{background:#C4954A;}
  .btn-save:disabled{opacity:.55;cursor:not-allowed;}
  .h-msg.ok{color:#7DE0A0;font-size:13.5px;}
  .h-msg.err{color:#FF8A98;font-size:13.5px;}
  .h-meta{font-size:12px;color:var(--glass-muted);}

  @media (max-width:820px){
    .h-grid{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .detail-grid{grid-template-columns:1fr;}
    .wrap{padding:28px 18px 56px;}
    .header-inner{padding:12px 18px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img src="assets/logo-kpjb.png" alt="Logo PT KPJB" class="brand-logo">
      <div class="brand-name">PT KPJB<strong>Dashboard Admin WBS</strong></div>
    </div>
    <button id="logoutBtn" type="button">Keluar</button>
  </div>
</header>

<div class="wrap">

  <div id="loginBox" class="glass-card">
    <h2>Masuk sebagai Admin</h2>
    <p>Hanya akun terdaftar yang dapat melihat laporan pengaduan.</p>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <button id="loginBtn" type="button">Masuk</button>
    <div id="loginErr"></div>
  </div>

  <div id="dash">
    <h1 class="page-title" id="pageTitle">Laporan Masuk</h1>
    <p class="page-sub" id="pageSub">Kelola dan tindak lanjuti laporan pengaduan WBS.</p>

    <div class="tabs" role="tablist" aria-label="Jenis laporan">
      <button type="button" class="tab" role="tab" data-tab="aduan" aria-selected="true">Pengaduan <span class="badge" id="badgeaduan">0</span></button>
      <button type="button" class="tab" role="tab" data-tab="self" aria-selected="false">Self-Report Gratifikasi <span class="badge" id="badgeself">0</span></button>
    </div>

    <div class="stats">
      <div class="stat glass-card"><div class="n" id="statTotal">0</div><div class="l">Total Laporan</div></div>
      <div class="stat glass-card"><div class="n" id="statBaru">0</div><div class="l">Baru</div></div>
      <div class="stat glass-card"><div class="n" id="statProses">0</div><div class="l">Diproses</div></div>
      <div class="stat glass-card"><div class="n" id="statSelesai">0</div><div class="l">Selesai</div></div>
    </div>

    <div id="loadMsg">Memuat laporan…</div>

    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table>
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="reportsBody"></tbody>
      </table>
      <div id="emptyState" class="empty" style="display:none;">Belum ada laporan masuk.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // Samakan dengan nilai di index.html
  const SUPABASE_URL = "https://knjllnemepisztoicfhb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuamxsbmVtZXBpc3p0b2ljZmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjIwODIsImV4cCI6MjEwNDMzODA4Mn0.Vl9QRbZTR0E_W8cpd2EsEVvc6ipC0QQAjQMxvTunSAo";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginBox = document.getElementById('loginBox');
  const dash = document.getElementById('dash');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginErr.textContent = '';
    loginBtn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    if (error) {
      loginErr.textContent = 'Login gagal: ' + error.message;
    } else {
      showDashboard();
    }
  }
  loginBtn.addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  async function showDashboard() {
    loginBox.style.display = 'none';
    dash.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    await loadAll();
  }

  function fmtDate(d) {
    if (!d) return '-';
    const dt = new Date(String(d).length === 10 ? d + 'T00:00:00' : d);
    return isNaN(dt) ? escapeHtml(d) : dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function fmtRp(n) {
    if (n === null || n === undefined || n === '') return '-';
    const v = Number(n);
    return isNaN(v) ? '-' : 'Rp ' + v.toLocaleString('id-ID');
  }
  function kv(label, value, full) {
    return `<div class="kv${full ? ' full' : ''}"><div class="k">${label}</div><div class="v">${value}</div></div>`;
  }
  const nl2br = (t) => escapeHtml(t).replace(/\n/g, '<br>');

  // Tautan file bukti (dibuat lewat DOM; link bertanda-tangan berlaku 2 menit)
  function makeFileLink(f) {
    const a = document.createElement('a');
    a.href = '#';
    a.className = 'file-link';
    a.textContent = String(f.name || 'file');
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      const { data: signed, error } = await sb.storage.from('bukti-laporan').createSignedUrl(f.path, 120);
      if (error) { alert('Gagal membuka file: ' + error.message); return; }
      window.open(signed.signedUrl, '_blank', 'noopener');
    });
    return a;
  }
  const validFiles = (arr) => Array.isArray(arr) ? arr.filter(f => f && typeof f.path === 'string') : [];

  // Unggah lewat Edge Function (server memvalidasi ukuran & tipe file)
  async function uploadEvidence(file, uploadId) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('uploadId', uploadId);
    const res = await fetch(SUPABASE_URL + '/functions/v1/upload-bukti', {
      method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY }, body: fd,
    });
    const json = await res.json();
    if (!res.ok) throw new Error('Gagal mengunggah ' + file.name + ': ' + (json.error || res.statusText));
    return { name: json.name, path: json.path };
  }

  // Status penyerahan uang/barang (dicatat admin)
  const PEN_LABEL = {
    menunggu: 'Menunggu penyerahan / verifikasi',
    diterima: 'Sudah diterima Tim Anti-Penyuapan',
    tidak_dapat_diserahkan: 'Tidak dapat diserahkan',
  };
  const PEN_SHORT = { menunggu: 'Menunggu', diterima: 'Diterima Tim AP', tidak_dapat_diserahkan: 'Tidak dapat diserahkan' };
  const PEN_CLASS = { menunggu: 'pen-wait', diterima: 'pen-ok', tidak_dapat_diserahkan: 'pen-no' };
  function penBadge(r) {
    const k = PEN_LABEL[r.status_penyerahan] ? r.status_penyerahan : 'menunggu';
    return `<span class="pen ${PEN_CLASS[k]}">${PEN_SHORT[k]}</span>`;
  }

  function buildPenyerahanPanel(r, tr) {
    const MAX_FILES = 5, MAX_MB = 10;
    const box = document.createElement('div');
    box.className = 'handling';
    box.innerHTML = `
      <div class="h-title">Penyerahan ke Tim Anti-Penyuapan <span>(diisi admin)</span></div>
      <div class="h-grid">
        <div class="hf"><label>Status penyerahan</label>
          <select class="h-status">
            ${Object.keys(PEN_LABEL).map(k => `<option value="${k}">${PEN_LABEL[k]}</option>`).join('')}
          </select></div>
        <div class="hf"><label>Tanggal diterima</label><input type="date" class="h-date"></div>
        <div class="hf full"><label>Catatan admin</label><textarea class="h-note" rows="2"></textarea></div>
        <div class="hf full"><label>Bukti penyerahan</label>
          <div class="h-files"></div>
          <input type="file" class="h-file" multiple accept="image/*,.pdf,.doc,.docx">
          <div class="h-newlist"></div>
          <div class="h-hint">Berita acara, foto penyerahan, atau tanda terima. Maks. ${MAX_FILES} file baru per simpan, masing-masing ${MAX_MB}MB. Bukti yang sudah tersimpan tidak dapat dihapus dari sini.</div></div>
      </div>
      <div class="h-actions">
        <button type="button" class="btn-save">Simpan penanganan</button>
        <span class="h-msg"></span><span class="h-meta"></span>
      </div>`;

    const statusSel = box.querySelector('.h-status');
    const dateInp = box.querySelector('.h-date');
    const noteInp = box.querySelector('.h-note');
    const filesBox = box.querySelector('.h-files');
    const fileInp = box.querySelector('.h-file');
    const newList = box.querySelector('.h-newlist');
    const saveBtn = box.querySelector('.btn-save');
    const msg = box.querySelector('.h-msg');
    const meta = box.querySelector('.h-meta');

    const d = new Date();
    dateInp.max = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

    let pending = [];

    function fillFromRow() {
      statusSel.value = PEN_LABEL[r.status_penyerahan] ? r.status_penyerahan : 'menunggu';
      dateInp.value = r.tanggal_diterima || '';
      noteInp.value = r.catatan_admin || '';
      filesBox.innerHTML = '';
      const ex = validFiles(r.bukti_penyerahan);
      if (!ex.length) { filesBox.textContent = 'Belum ada bukti penyerahan.'; }
      ex.forEach(f => filesBox.appendChild(makeFileLink(f)));
      meta.textContent = r.penyerahan_diperbarui_at
        ? 'Terakhir diperbarui ' + fmtDate(r.penyerahan_diperbarui_at) + (r.penyerahan_diperbarui_oleh ? ' oleh ' + r.penyerahan_diperbarui_oleh : '')
        : '';
    }
    function renderPending() {
      newList.innerHTML = '';
      pending.forEach((f, i) => {
        const row = document.createElement('div');
        const lbl = document.createElement('span');
        lbl.textContent = f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
        const rm = document.createElement('button');
        rm.type = 'button'; rm.textContent = 'Hapus';
        rm.addEventListener('click', () => { pending.splice(i, 1); renderPending(); });
        row.appendChild(lbl); row.appendChild(rm); newList.appendChild(row);
      });
    }
    fileInp.addEventListener('change', () => {
      for (const f of fileInp.files) {
        if (pending.length >= MAX_FILES) { alert('Maksimal ' + MAX_FILES + ' file baru per simpan.'); break; }
        if (f.size > MAX_MB * 1024 * 1024) { alert(f.name + ' melebihi ' + MAX_MB + 'MB, dilewati.'); continue; }
        pending.push(f);
      }
      fileInp.value = '';
      renderPending();
    });

    function say(text, cls) { msg.textContent = text; msg.className = 'h-msg ' + (cls || ''); }

    saveBtn.addEventListener('click', async () => {
      const status = statusSel.value;
      const tgl = dateInp.value || null;
      const existing = validFiles(r.bukti_penyerahan);
      if (status === 'diterima') {
        if (!tgl) { say('Isi tanggal diterima terlebih dahulu.', 'err'); return; }
        if (existing.length + pending.length === 0) { say('Unggah minimal satu bukti penyerahan.', 'err'); return; }
      }
      saveBtn.disabled = true;
      say('Menyimpan…');
      try {
        const uploaded = [];
        for (let i = 0; i < pending.length; i++) {
          say('Mengunggah file ' + (i + 1) + ' dari ' + pending.length + '…');
          uploaded.push(await uploadEvidence(pending[i], 'penyerahan-' + r.id));
        }
        const { data, error } = await sb.from('self_reports').update({
          status_penyerahan: status,
          tanggal_diterima: tgl,
          catatan_admin: noteInp.value.trim() || null,
          bukti_penyerahan: existing.concat(uploaded),
        }).eq('id', r.id).select().single();
        if (error) throw new Error(error.message);

        Object.assign(r, data);
        pending = []; renderPending(); fillFromRow();
        const cell = tr.querySelector('.pen-cell');
        if (cell) cell.innerHTML = penBadge(r);
        say('Tersimpan.', 'ok');
      } catch (err) {
        say('Gagal menyimpan: ' + err.message, 'err');
      } finally {
        saveBtn.disabled = false;
      }
    });

    fillFromRow();
    return box;
  }

  // Konfigurasi tiap jenis laporan
  const TABS = {
    aduan: {
      table: 'reports',
      title: 'Laporan Pengaduan',
      sub: 'Kelola dan tindak lanjuti laporan pengaduan WBS.',
      cols: ['No. Kasus', 'Tanggal', 'Terlapor', 'Kriteria', 'Status', ''],
      cells: (r) => `<td>${escapeHtml(r.nama_terlapor)}</td><td class="muted">${escapeHtml(r.kriteria_pelanggaran)}</td>`,
      details: (r) => [
        kv('Pelapor', escapeHtml(r.nama_pelapor)),
        kv('Kontak pelapor', escapeHtml(r.email_pelapor) + '<br>' + escapeHtml(r.no_hp_pelapor)),
        kv('Jabatan terlapor', escapeHtml(r.jabatan_terlapor || '-')),
        kv('Frekuensi kejadian', escapeHtml(r.frekuensi_kejadian)),
        kv('Waktu kejadian', escapeHtml(r.waktu_kejadian)),
        kv('Lokasi kejadian', escapeHtml(r.lokasi_kejadian)),
        kv('Saksi mata', escapeHtml(r.saksi_mata || '-')),
        kv('Pihak terlibat', escapeHtml(r.pihak_terlibat || '-')),
        kv('Kronologi', nl2br(r.kronologi), true),
      ].join(''),
    },
    self: {
      table: 'self_reports',
      title: 'Self-Report Gratifikasi',
      sub: 'Laporan mandiri karyawan atas penerimaan uang, barang, atau fasilitas.',
      cols: ['No. Kasus', 'Tanggal', 'Pelapor', 'Penerimaan', 'Status', ''],
      cells: (r) => `<td>${escapeHtml(r.nama_pelapor)}<div class="sub">ID ${escapeHtml(r.id_karyawan)}</div></td>`
        + `<td class="muted">${escapeHtml(r.jenis_penerimaan)}<div class="sub">${fmtRp(r.estimasi_nilai)}</div><div class="pen-cell">${penBadge(r)}</div></td>`,
      handling: buildPenyerahanPanel,
      details: (r) => [
        kv('Pelapor', escapeHtml(r.nama_pelapor) + ' (ID ' + escapeHtml(r.id_karyawan) + ')'),
        kv('Jabatan / unit kerja', escapeHtml(r.jabatan_unit)),
        kv('Kontak', escapeHtml(r.email_pelapor) + '<br>' + escapeHtml(r.no_hp_pelapor)),
        kv('Jenis penerimaan', escapeHtml(r.jenis_penerimaan)),
        kv('Uraian uang / barang', nl2br(r.deskripsi_penerimaan), true),
        kv('Perkiraan nilai', fmtRp(r.estimasi_nilai)),
        kv('Tanggal penerimaan', fmtDate(r.tanggal_penerimaan)),
        kv('Lokasi penerimaan', escapeHtml(r.lokasi_penerimaan)),
        kv('Pemberi', escapeHtml(r.nama_pemberi) + (r.instansi_pemberi ? ' — ' + escapeHtml(r.instansi_pemberi) : '')),
        kv('Hubungan dengan perusahaan', escapeHtml(r.hubungan_bisnis)),
        kv('Kronologi', nl2br(r.kronologi), true),
        kv('Kondisi menurut pelapor', escapeHtml(r.status_penanganan)),
        kv('Tanggal penyerahan menurut pelapor', fmtDate(r.tanggal_penyerahan)),
        kv('Pernyataan pelapor', r.pernyataan_benar ? 'Menyatakan informasi benar dan bersedia mengikuti arahan Tim Anti-Penyuapan' : '-', true),
      ].join(''),
    },
  };

  const store = { aduan: { rows: [], error: null }, self: { rows: [], error: null } };
  let activeTab = 'aduan';

  async function loadAll() {
    const loadMsg = document.getElementById('loadMsg');
    loadMsg.style.display = 'block';
    loadMsg.textContent = 'Memuat laporan…';
    await Promise.all(Object.keys(TABS).map(async (k) => {
      const { data, error } = await sb.from(TABS[k].table).select('*').order('created_at', { ascending: false });
      store[k] = { rows: data || [], error: error ? error.message : null };
    }));
    updateBadges();
    renderActive();
  }

  function updateBadges() {
    Object.keys(TABS).forEach((k) => {
      const n = store[k].rows.filter((r) => r.status === 'baru').length;
      const el = document.getElementById('badge' + k);
      el.textContent = n;
      el.classList.toggle('on', n > 0);
    });
  }

  function renderActive() {
    const cfg = TABS[activeTab];
    const st = store[activeTab];
    const loadMsg = document.getElementById('loadMsg');
    const wrap = document.getElementById('tableWrap');
    document.getElementById('pageTitle').textContent = cfg.title;
    document.getElementById('pageSub').textContent = cfg.sub;
    renderStats(st.rows);

    if (st.error) {
      wrap.style.display = 'none';
      loadMsg.style.display = 'block';
      loadMsg.textContent = 'Gagal memuat ' + cfg.title + ': ' + st.error;
      return;
    }
    loadMsg.style.display = 'none';
    wrap.style.display = 'block';
    document.getElementById('theadRow').innerHTML = cfg.cols.map((c) => `<th>${c}</th>`).join('');
    renderTable(st.rows, cfg);
  }

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === t)));
      renderActive();
    });
  });

  function renderStats(data) {
    document.getElementById('statTotal').textContent = data.length;
    document.getElementById('statBaru').textContent = data.filter(r => r.status === 'baru').length;
    document.getElementById('statProses').textContent = data.filter(r => r.status === 'diproses').length;
    document.getElementById('statSelesai').textContent = data.filter(r => r.status === 'selesai').length;
  }

  function renderTable(data, cfg) {
    const body = document.getElementById('reportsBody');
    body.innerHTML = '';
    document.getElementById('emptyState').style.display = data.length ? 'none' : 'block';

    data.forEach(r => {
      const tr = document.createElement('tr');
      tr.className = 'main';
      tr.innerHTML = `
        <td class="case-no">${escapeHtml(r.case_number)}</td>
        <td class="muted">${fmtDate(r.created_at)}</td>
        ${cfg.cells(r)}
        <td>
          <select class="statusSel st-${escapeHtml(r.status)}">
            <option value="baru" ${r.status==='baru'?'selected':''}>Baru</option>
            <option value="diproses" ${r.status==='diproses'?'selected':''}>Diproses</option>
            <option value="selesai" ${r.status==='selesai'?'selected':''}>Selesai</option>
            <option value="ditolak" ${r.status==='ditolak'?'selected':''}>Ditolak</option>
          </select>
        </td>
        <td><button class="expand" type="button">Detail</button></td>
      `;

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.innerHTML = `
        <td colspan="6">
          <div class="detail-grid">
            ${cfg.details(r)}
            <div class="kv full"><div class="k">Bukti pendukung</div><div class="v bukti-links"></div></div>
          </div>
        </td>
      `;

      // Bukti file dibangun lewat DOM (bukan string HTML) supaya nama file tidak bisa menyisipkan kode.
      const buktiBox = detailTr.querySelector('.bukti-links');
      const files = Array.isArray(r.bukti_files) ? r.bukti_files.filter(f => f && typeof f.path === 'string') : [];
      if (!files.length) {
        buktiBox.textContent = 'Tidak ada';
      } else {
        files.forEach(f => buktiBox.appendChild(makeFileLink(f)));
      }
      if (cfg.handling) {
        detailTr.querySelector('.detail-grid').appendChild(cfg.handling(r, tr));
      }

      tr.querySelector('.expand').addEventListener('click', () => {
        detailTr.classList.toggle('show');
      });

      const sel = tr.querySelector('.statusSel');
      sel.addEventListener('change', async (e) => {
        const { error } = await sb.from(cfg.table).update({ status: e.target.value }).eq('id', r.id);
        if (error) {
          alert('Gagal memperbarui status: ' + error.message);
          e.target.value = r.status;
          return;
        }
        r.status = e.target.value;
        sel.className = 'statusSel st-' + r.status;
        renderStats(data);
        updateBadges();
      });

      body.appendChild(tr);
      body.appendChild(detailTr);
    });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Cek jika sudah login sebelumnya (session tersimpan)
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) showDashboard();
  });
</script>
